<script>
/*
 * Impasto: thick oil paint on her room at four, lit by the night light (WebGL2). The painting the piece starts from is a
 * plate; every stroke laid on it is a ribbon cut from a real loaded stroke (the strip atlas: R the paint's own light, G its
 * coverage, B its thickness), tinted with two pigments that streak along the bristles without mixing. Strokes go to one
 * of three layers: "under" (the room's own, coloured like the plate, so the night grades them too), "paint" (hers,
 * always in full colour) or "eyes" (the two small strokes of light, kept apart so they can close and open). Every stroke
 * but the eyes adds its thickness to one height field. Each frame lights that field from the lamp: ridges facing it
 * brighten, the far sides turn blue, wet paint shines, and nothing is ever black.
 *
 * Coordinates are the canvas's pixels, y down. Plain script: defines window.Impasto.
 */
(function () {
  "use strict";
  const VS_STROKE = `#version 300 es
in vec2 aPos; in vec2 aUV;
uniform vec2 uRes;
out vec2 vUV; out vec2 vPx;
void main() { vUV = aUV; vPx = aPos; gl_Position = vec4(aPos.x / uRes.x * 2.0 - 1.0, aPos.y / uRes.y * 2.0 - 1.0, 0.0, 1.0); }`;
  // One stroke: the strip is sampled across (v) and along (u); two pigments in bristle-wide streaks.
  const FS_STROKE = `#version 300 es
precision highp float;
in vec2 vUV; in vec2 vPx;
uniform sampler2D uStamp; uniform sampler2D uMask;
uniform vec2 uRes; uniform float uIdx, uN, uAlpha, uSeed, uH, uWet, uMode, uMaskCh, uStreak, uCut;
uniform vec3 uA, uB;
out vec4 o;
float h11(float n) { return fract(sin(n * 127.1 + uSeed * 311.7) * 43758.5453); }
void main() {
  if (vUV.x > uCut) discard;
  vec2 st = vec2((uIdx + clamp(vUV.y * 0.5 + 0.5, 0.004, 0.996)) / uN, vUV.x);
  vec4 s = texture(uStamp, st);
  float cov = s.g * uAlpha;
  if (uMaskCh > 0.5) {
    vec4 m = texture(uMask, vPx / uRes);
    cov *= uMaskCh < 1.5 ? m.r : uMaskCh < 2.5 ? m.g : m.b;
  }
  if (cov < 0.004) discard;
  float lane = floor((vUV.y * 0.5 + 0.5) * 18.0);
  float b = h11(lane) * 0.75 + h11(lane + 40.0 + floor(vUV.x * 3.0)) * 0.25;
  vec3 col = mix(uA, uB, smoothstep(1.0 - uStreak, 1.0 - uStreak * 0.45, b));
  col *= 0.84 + 0.32 * s.r;
  if (uMode < 0.5) o = vec4(col * cov, cov);
  else o = vec4(cov * uH * s.b * 1.3, cov * uWet, 0.0, 0.0);
}`;
  const VS_QUAD = `#version 300 es
in vec2 aPos; out vec2 vQ;
void main() { vQ = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;
  // The frame: the plate (graded into night where the lamp has not reached) under the paint, lit through the heights;
  // then the two small lights, which hold the lamp, close and open.
  const FS_FRAME = `#version 300 es
precision highp float;
in vec2 vQ;
uniform sampler2D uPlate, uUnder, uPaint, uHeight, uEyes;
uniform vec2 uRes;          // canvas size in px
uniform vec4 uView;         // screen -> canvas px: x0, y0, w, h (y down)
uniform float uFlip;        // 1 when drawing into a texture that is read back the other way up
uniform vec3 uLamp;         // canvas px x, y, and its height above the canvas
uniform vec3 uLampCol;
uniform float uPow, uReach; // the lamp's strength, and how far its warm light reaches (px)
uniform float uNight;       // 1: the room in blues and violets; 0: in its own colours everywhere
uniform float uRelief, uSpec, uDry, uTime, uBoil, uPlateRelief;
uniform vec4 uEyeA, uEyeB;  // the two lights: x, y, half width, half height
uniform float uOpen, uGlow;
uniform vec3 uFloor;
out vec4 o;
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y); }
float H(vec2 p) { return texture(uHeight, p / uRes).r; }
vec3 night(vec3 c) {
  float l = dot(c, vec3(0.299, 0.587, 0.114));
  vec3 lo = vec3(0.12, 0.13, 0.31), mid = vec3(0.25, 0.3, 0.62), hi = vec3(0.76, 0.77, 0.9);
  vec3 n = l < 0.45 ? mix(lo, mid, l / 0.45) : mix(mid, hi, (l - 0.45) / 0.55);
  return mix(n, c * vec3(0.62, 0.68, 1.05), 0.22);
}
vec4 eyeAt(vec2 p, vec4 e) {
  vec2 d = p - e.xy;
  if (abs(d.x) > e.z || abs(d.y) > e.w) return vec4(0.0);
  float k = max(uOpen, 0.05);
  if (abs(d.y) > e.w * k) return vec4(0.0);
  // Closing, the light narrows to the line along its middle, and comes back the same way.
  return texture(uEyes, vec2(p.x, e.y + d.y / k) / uRes);
}
void main() {
  vec2 sq = vec2(vQ.x, uFlip > 0.5 ? vQ.y : 1.0 - vQ.y);
  vec2 p = uView.xy + sq * uView.zw;
  vec2 tuv = p / uRes;
  if (tuv.x < 0.0 || tuv.y < 0.0 || tuv.x > 1.0 || tuv.y > 1.0) { o = vec4(uFloor, 1.0); return; }
  vec3 plate = texture(uPlate, tuv).rgb;
  vec4 under = texture(uUnder, tuv);
  vec3 base = plate * (1.0 - under.a) + under.rgb;
  vec2 dl = uLamp.xy - p;
  float d = length(dl);
  float warm = 1.0 - smoothstep(uReach * 0.5, uReach, d + (vnoise(p / 38.0) - 0.5) * uReach * 0.22);
  float nightK = uNight * (1.0 - warm);
  vec3 bc = mix(base, night(base), nightK);
  vec4 paint = texture(uPaint, tuv);
  vec3 alb = bc * (1.0 - paint.a) + paint.rgb;
  // The relief: the paint's thickness, a little of the plate's own (its light is painted in), and a slow boil of the
  // normals at eight frames a second, the way a film painted frame by frame never stands quite still.

    if (idle > 10 && hinted && now() - hinted > 9.5 && now() - hinted < 10) { const [x, y] = toScreen(300, 230); hint(WD.hint2, x, y); }
    if (idle > 22 || t > BEAT_MAX) { autoFill("sky", 3); go("skyDone"); }
  } else if (phase === "skyDone") {
    while (starsLit < 3 && t > 0.6 + starsLit * 0.7) lightStar(starsLit++);
    if (t > 1.6) sayHis("q2", 6);
    if (t > 7.6) { go("push"); moveTo(turnView(), 3.6); camMode = "cam"; babyAt = now() + 1.2; eyes.foldStrokes = R.fold(rnd, sample); eyes.folds = 0; }
  } else if (phase === "push") {

    while (eyes.folds < n && t > 0.9) { P.stroke(folds[eyes.folds]); eyes.folds += 1; brush(0.5); }

    if (idle > 10 && hinted && now() - hinted > 9.5 && now() - hinted < 10) { const [x, y] = eyeHint(); hint(WD.hint3, x, y); }

    st.glow = clamp(t / 1.2) * (0.85 + 0.15 * Math.sin(now() * 1.4));
    if (t > 0.2 && !box) { box = { at: now(), dur: musicBox(LULL_A, 0.62, 0.18) }; moveTo(turnView(2.05), 6); }
    if (t > 2.2 && !her.some((h) => h.text === WD.her)) sayHer(WD.her, { slot: "top", replace: true });

}
const eyeHint = () => { const mx = (G.eyes[0][0] + G.eyes[1][0]) / 2, my = (G.eyes[0][1] + G.eyes[1][1]) / 2; const v = turnView(); return [stage.x + ((mx - v[0]) / v[2]) * stage.w, stage.y + ((my - v[1]) / v[3]) * stage.h]; };

/* ---------- input ---------- */
let hold = null;
addEventListener("pointerdown", (e) => {
  hear(); lastInput = now();

  if (phase === "letter" && reveal.keep) { finish(); return; }
  if (["hang", "letter", "dry", "blink", "push"].includes(phase)) { S.tap(0.25); return; }
  const [x, y] = toDesign(e.clientX, e.clientY);
  if (phase === "eyes") { placeEye(true); return; }
  hold = { x, y, lx: x, ly: y, travel: 0 };
  paintAt(x, y, -Math.PI / 2 + (rnd() - 0.5), true);
}, { passive: true });
addEventListener("pointermove", (e) => {
  if (!hold || !P) return;
  const [x, y] = toDesign(e.clientX, e.clientY), dx = x - hold.lx, dy = y - hold.ly, d = Math.hypot(dx, dy);
  if (d < 20) return;
  paintAt(x, y, Math.atan2(dy, dx), true);
  hold.lx = x; hold.ly = y; lastInput = now();
}, { passive: true });
const lift = () => { hold = null; };
addEventListener("pointerup", lift, { passive: true }); addEventListener("pointercancel", lift, { passive: true });
function paintAt(x, y, a, mine) {
  if (x < 0 || y < 0 || x > R.W || y > R.H) return;
  const near = phase === "halo" || phase === "haloDone" ? haloAt(x, y, mine) : false;
  const sky = !near && (phase === "sky" || phase === "skyDone") ? skyAt(x, y, mine) : false;
  if (!near && !sky) roomAt(x, y, a, mine);
  brush(1);
  if (mine && phase === "halo" && strokes >= 4) sayHis("v2", 3.6);
}

/* ---------- the reveal: his wall, then his letter ---------- */
const reveal = { snap: null, keep: 0 };
// Where her picture hangs on his wall (in the wall plate's pixels): between Boch and Milliet, tilted as the wall is.
const HANG = { x: 374, y: 206, h: 300, tilt: -0.16 };
function letterSpan() { return lettering().reduce((n, l) => Math.max(n, l.at + l.text.length * l.per), 0); }
let letterCache = null;
function lettering() {
  if (letterCache && letterCache.w === stage.w) return letterCache.lines;
  const fs = EN ? 17 : 16.5, lh = EN ? 24 : 27, mw = Math.min(stage.w, 420) - 64, out = [];
  o.save(); o.font = `${fs}px ${FONT.hand}`;
  let y = 0, at = 0;
  for (const [text, ind, kind] of LETTER) {
    if (kind === "close") { out.push({ text, x: "right", y, at, per: 0.05, kind }); y += lh; at += text.length * 0.05 + 0.2; continue; }
    if (kind === "ask") { y += 6; out.push({ text, x: ind * fs * 0.5, y: y + 4, at: at + 0.3, per: 0.09, kind }); y += lh + 14; at += 1.2; continue; }
    const words = EN ? text.split(" ") : [...text], gap = EN ? " " : "";
    let line = "", x0 = ind * fs * (EN ? 1.1 : 1);
    for (const wd of words) {
      const test = line ? line + gap + wd : wd;
      if (line && x0 + o.measureText(test).width > mw) { out.push({ text: line, x: x0, y, at, per: EN ? 0.018 : 0.05 }); at += line.length * (EN ? 0.018 : 0.05); y += lh; line = wd; x0 = 0; }
      else line = test;
    }
    if (line) { out.push({ text: line, x: x0, y, at, per: EN ? 0.018 : 0.05 }); at += line.length * (EN ? 0.018 : 0.05) + 0.25; y += lh + 6; }
  }
  o.restore();
  letterCache = { w: stage.w, lines: out, height: y };
  return out;
}

function drawWall(t) {
  const im = IMG.bedroom; if (!im || !reveal.snap) return;
  const L = phase === "letter" ? ease((now() - t0) / 1.6) : 0;
  const k1 = ease(t / 2.4), push = ease((t - 2.4) / 4.4);
  // The wall's camera: from the whole of the wall to her picture, then up, to leave room for the letter.
  const cover = Math.max(stage.w / im.width, stage.h / im.height);
  // Close enough at the end of the push for the lamp, the 90 on the bottle and the window to be read.
  const wideZ = Math.max(cover, stage.w / 600), closeZ = Math.max(cover, Math.min((stage.h * 0.68) / HANG.h, (stage.w * 0.8) / (HANG.h * R.W / R.H))), letterZ = Math.max(cover, (stage.h * 0.36) / HANG.h);

  const fy = phase === "letter" ? lerp(0.45, 0.25, L) : lerp(0.36, 0.45, push);

  // stage into its place on his wall.
  const fh = HANG.h * z, fw = fh * R.W / R.H, hx = cx + HANG.x * z, hy = cy + HANG.y * z;
  const sx = stage.x + stage.w / 2, sy = stage.y + stage.h / 2, sh = stage.h, sw = sh * R.W / R.H;
  const m = phase === "hang" ? k1 : 1;
  const ph = lerp(sh, fh, m), pw = lerp(sw, fw, m), px = lerp(sx, hx, m), py = lerp(sy, hy, m), tilt = lerp(0, HANG.tilt, m), rim = ph * 0.035 * m;

  o.fillStyle = "#f2ede0"; o.fillRect(-pw / 2 - rim, -ph / 2 - rim, pw + rim * 2, ph + rim * 2);
  o.shadowColor = "transparent";
  o.drawImage(reveal.snap, -pw / 2, -ph / 2, pw, ph);
  o.strokeStyle = `rgba(52,70,140,${0.75 * m})`; o.lineWidth = Math.max(1, rim * 0.18); o.strokeRect(-pw / 2 - rim, -ph / 2 - rim, pw + rim * 2, ph + rim * 2);

    const txt = WD.hang, n = EN ? txt.length : [...txt].length, shown = EN ? txt.slice(0, Math.ceil(n * wt)) : [...txt].slice(0, Math.ceil(n * wt)).join("");
    o.shadowColor = "rgba(250,246,234,0.9)"; o.shadowBlur = 6;
    o.fillStyle = "rgba(52,36,40,0.92)"; o.fillText(shown, 0, ph / 2 + rim + 12);

}

function drawLetter() {
  const im = IMG.paper; if (!im) return;
  const k = easeOut((now() - t0) / 1.4), lines = lettering();
  const pw = Math.min(stage.w - 20, 400), ph = pw * im.height / im.width, x0 = stage.x + (stage.w - pw) / 2;
  const top = stage.y + stage.h * 0.43, y0 = lerp(stage.y + stage.h + 20, top, k);
  o.save();
  o.shadowColor = "rgba(24,20,48,0.55)"; o.shadowBlur = 26; o.shadowOffsetY = 8;
  o.drawImage(im, x0, y0, pw, ph);

  o.save(); o.fillStyle = "#3b2b22"; o.textBaseline = "alphabetic";

    const chars = EN ? l.text.slice(0, n) : [...l.text].slice(0, n).join("");
    o.font = l.kind === "ask" ? `${EN ? 22 : 21}px ${FONT.hand}` : `${fs}px ${FONT.hand}`;
    o.textAlign = l.x === "right" ? "right" : "left";

/* ---------- words on the screen ---------- */
function drawHer() {
  for (const h of her) {
    const age = now() - h.t0, fade = h.ms ? clamp(age / 0.8) * clamp((h.ms - age) / 0.8) : clamp(age / 0.9);
    if (fade <= 0) continue;
    o.save(); o.globalAlpha = fade; o.textAlign = h.at ? "left" : "center"; o.textBaseline = "middle";
    o.font = `${EN ? h.size + 1 : h.size}px ${FONT.her}`;

    o.shadowColor = "rgba(14,16,44,0.9)"; o.shadowBlur = 12; o.fillStyle = "rgba(250,242,220,0.96)";
    if (h.at) { const [x, y] = toScreen(h.at[0], h.at[1]); o.fillText(h.text, x + 26, y - 22); o.fillText(h.text, x + 26, y - 22); }
    else { const y = stage.y + Math.max(46, stage.h * 0.075); const wrap = EN ? wrapText(h.text, stage.w - 48) : [h.text]; wrap.forEach((s, i) => { o.fillText(s, stage.x + stage.w / 2, y + i * 26); o.fillText(s, stage.x + stage.w / 2, y + i * 26); }); }
    o.restore();

  if (line) out.push(line);
  return out;
}

  if (!slip || !IMG.paper) return;

  if (age > slip.ms + 0.6) { slip = null; return; }

  const x = stage.x + (stage.w - w) / 2, y = stage.y + stage.h - 26 - lerp(-h - 30, h, up) + 0;
  const im = IMG.paper;

  o.shadowColor = "rgba(14,12,34,0.55)"; o.shadowBlur = 16; o.shadowOffsetY = 5;
  o.drawImage(im, 0, im.height * 0.42, im.width, im.width * h / w, -w / 2, -h / 2, w, h);

  o.fillStyle = "#3b2b22"; o.textAlign = "left"; o.textBaseline = "alphabetic"; o.font = `${fs}px ${FONT.hand}`;
  slip.lines.forEach((s, i) => o.fillText(s, -w / 2 + 20, -h / 2 + 15 + (i + 1) * lh - 5));
  if (slip.src) { o.globalAlpha = 0.6; o.font = `12px ${FONT.hand}`; o.textAlign = "right"; o.fillText(slip.src, w / 2 - 16, h / 2 - 11); }
  o.restore();
}

/* ---------- the room round her canvas, in a wide window ---------- */
function drawBg() {
  bgx.setTransform(scr.dpr, 0, 0, scr.dpr, 0, 0);
  bgx.fillStyle = "#151a33"; bgx.fillRect(0, 0, scr.w, scr.h);
  if (!scr.wide) return;
  const im = IMG.arles, day = phase === "hang" || phase === "letter" ? ease((now() - t0) / 2.4) * (phase === "letter" ? 1 : 1) : 0;
  if (im) {
    const s = Math.max(scr.w / im.width, scr.h / im.height);
    bgx.globalAlpha = 0.9; bgx.drawImage(im, (scr.w - im.width * s) / 2, (scr.h - im.height * s) / 2, im.width * s, im.height * s); bgx.globalAlpha = 1;
  }

  if (day > 0) { bgx.globalCompositeOperation = "screen"; bgx.fillStyle = `rgba(90,80,60,${0.35 * day})`; bgx.fillRect(0, 0, scr.w, scr.h); bgx.globalCompositeOperation = "source-over"; }

  bgx.fillStyle = "#e9e0c8"; bgx.fillRect(stage.x - 6, stage.y - 6, stage.w + 12, stage.h + 12); bgx.restore();
}

/* ---------- the end ---------- */
function finish() {

  finished = true; LP.hint(null); S.chime(); LP.haptic(16);
  const n = strokes, back = EN
    ? (n ? `There are ${n} strokes of yours in this picture; the last two are Xiaoman${eyesBy === "her" ? "" : ", and I put those in for you"}. \u2014 Vincent` : "I painted this one for you. The last two strokes are Xiaoman. \u2014 Vincent")
    : (n ? `这幅画里有你 ${n} 笔；最后两笔，是小满${eyesBy === "her" ? "" : "，是我替你点的"}。——文森特` : "这幅画是我替你画的。最后两笔，是小满。——文森特");
  let image = "";
  try { const c = reveal.snap || P.snapshot(480, 1000, now()); const s = document.createElement("canvas"); s.width = 480; s.height = Math.round(480 * c.height / c.width); s.getContext("2d").drawImage(c, 0, 0, s.width, s.height); image = s.toDataURL("image/jpeg", 0.84); } catch (_) { /* no picture */ }
  LP.done({ title: WD.title, line: WD.last, back, image });
}

/* ---------- the loop ---------- */
// What the shots script reads: the beat, and the frame rate over the last second (and its slowest frame).
const perf = { n: 0, t: 0, worst: 0, last: 0 };

  const showPaint = phase !== "hang" && phase !== "letter";
  glc.style.visibility = showPaint ? "visible" : "hidden";
  if (showPaint) { P.state.view = viewNow(); P.render(now()); }
  o.setTransform(scr.dpr, 0, 0, scr.dpr, 0, 0); o.clearRect(0, 0, scr.w, scr.h);

layout();
LP.onResize(() => { layout(); letterCache = null; });
load().then(() => {
  paintRoom();
  startedAt = now(); go("intro");
  requestAnimationFrame(frame);
}).catch((e) => { console.error(e && e.message); });
})();
