    # 人生广场·中文学习版 Life Plaza Learn（人生广场的教学分支，独立实例 8794，代码 /srv/life-learn）
    location = /life-learn { return 302 /life-learn/; }
    location = /life-learn/api/asr/stream {
        proxy_pass http://127.0.0.1:8794/life/api/asr/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
    location ^~ /life-learn/api/ {
        proxy_pass http://127.0.0.1:8794/life/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
        client_max_body_size 2m;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ^~ /life-learn/assets/ {
        root /srv/life-learn/www;
        gzip on;
        gzip_types application/javascript text/css application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ^~ /life-learn/ {
        root /srv/life-learn/www;
        try_files $uri $uri/ /life-learn/index.html;
        gzip on;
        gzip_types application/javascript text/css application/json;
        add_header X-Robots-Tag "noindex, nofollow" always;
        location ~* \.(glb|mp4|jpg|jpeg|png|webp|woff2)$ { expires 7d; }
        location = /life-learn/index.html { add_header Cache-Control "no-cache"; }
    }
