<script>
/*
 * What Li Shizhen's two court pieces share (《凌晨三点的脉案》, 《本草·韭》): a 390×844 stage scaled into any window
 * (the surround is the piece's own mount), the plates and fonts the build carries inline (window.LSZ_ASSETS), a
 * clock that can be slowed or sped, his brush hand and the woodblock type set in columns, the seal 「濒湖东璧」, the
 * pulse written as a water line, a small synth, hints the visitor (and the play bot) reads, and an answer to every
 * touch. A piece is a set of async beats run by LSZ.run().
 */
(function () {
"use strict";
const A = window.LSZ_ASSETS || { images: {}, meta: {}, fonts: [] };
const EN = LP.lang === "en";
const T = (zh, en) => (EN ? en : zh);
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
const easeOut = (t) => 1 - Math.pow(1 - clamp(t), 3);
const easeIn = (t) => Math.pow(clamp(t), 3);
const easeInOut = (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const span = (t, a, b) => clamp((t - a) / Math.max(1e-6, b - a));

/* ---------- stage ---------- */
const cv = document.getElementById("c"), g = cv.getContext("2d");
const S = { W: 1, H: 1, dpr: 1, k: 1, ox: 0, oy: 0, w: 390, h: 844, vw: 390, vh: 844, vx: 0, vy: 0 };
const resizers = [];
function fit() {
  const W = Math.max(1, Math.floor(innerWidth || 0)), H = Math.max(1, Math.floor(innerHeight || 0));
  const dpr = Math.min(2, devicePixelRatio || 1);
  const k = Math.max(0.01, Math.min(W / S.w, H / S.h));
  Object.assign(S, { W, H, dpr, k, ox: (W - S.w * k) / 2, oy: (H - S.h * k) / 2 });
  // The window in stage units: what lies beyond 0…390 and 0…844 is the surround.
  S.vx = -S.ox / k; S.vy = -S.oy / k; S.vw = W / k; S.vh = H / k;
  const bw = Math.max(1, Math.round(W * dpr)), bh = Math.max(1, Math.round(H * dpr));
  if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
  for (const fn of resizers) { try { fn(S); } catch (e) { console.error(e); } }
  if (hintNow) placeHint();
}
const stageT = () => g.setTransform(S.dpr * S.k, 0, 0, S.dpr * S.k, S.dpr * S.ox, S.dpr * S.oy);
const screenT = () => g.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
const toStage = (cx, cy) => [(cx - S.ox) / S.k, (cy - S.oy) / S.k];

/* ---------- clock, steps, frame rate ---------- */
const clock = { t: 0, speed: 1 };
const waits = [];
const log = [];
Object.defineProperty(window, "__lszLog", { value: log });
window.__lszStep = "";
window.__lszFps = 0;
function step(name) { window.__lszStep = name; log.push([Math.round(clock.t * 10) / 10, name]); }
const wait = (ms) => new Promise((r) => waits.push({ at: clock.t + ms / 1000, r }));
const until = (pred, maxMs = Infinity) => new Promise((r) => waits.push({ pred, at: clock.t + maxMs / 1000, r }));

/* ---------- plates and fonts ---------- */
const img = {};
const decoding = [];
for (const [id, src] of Object.entries(A.images || {})) {
  const im = new Image();
  im.decoding = "async";
  im.src = src;
  img[id] = im;
  decoding.push(im.decode ? im.decode().catch(() => {}) : new Promise((r) => { im.onload = im.onerror = r; }));

  L.step("twelve");

  g.beginPath(); g.arc(f.x, f.y, r, 0, TAU); g.fill();
  g.shadowColor = "transparent";
  g.save(); g.beginPath(); g.arc(f.x, f.y, r - 1, 0, TAU); g.clip();
  const sk = L.silk(160, 160, "#ece2ca", { seed: `fan${f.kind}`, fibre: "rgba(120,86,50,", n: 0.9, light: 0.22 });
  g.drawImage(sk, f.x - r, f.y - r, r * 2, r * 2);
  const sh = g.createRadialGradient(f.x - r * 0.3, f.y - r * 0.35, r * 0.1, f.x, f.y, r * 1.05);
  sh.addColorStop(0, "rgba(255,250,236,0.25)"); sh.addColorStop(1, "rgba(110,80,50,0.22)");
  g.fillStyle = sh; g.fillRect(f.x - r, f.y - r, r * 2, r * 2);
  const tt = L.clock.t;
  if (f.kind === "thin") {
    const pts = [];
    for (let x = -r + 8; x <= r - 8; x += 1.5) {
      const ph = ((x + r) / 22 - tt * 1.1) % 1, b = L.beatShape(((ph % 1) + 1) % 1);
      pts.push([f.x - x, f.y - b * 3.4 * f.head, 1.0 + b * 0.55]);
    }
    L.ribbon(g, pts, f.head, { color: `rgba(${FAN_INK},0.92)` });
    // Beads along the thread: 累累, one after another.
    for (let i = 0; i < 9; i += 1) {
      const x = f.x + r - 12 - i * ((2 * r - 24) / 8), on = (r - 12 - i * ((2 * r - 24) / 8) + r) / (2 * r);
      if (1 - on > f.head) continue;
      g.fillStyle = `rgba(${FAN_INK},${0.7 + 0.25 * Math.sin(tt * 3 + i)})`;
      g.beginPath(); g.arc(x, f.y, 1.7, 0, TAU); g.fill();
    }
  } else {
    // The surface of the water, a stone falling through it to the very bottom, a ring for every beat.
    const wy = f.y - r * 0.2;
    g.fillStyle = "rgba(120,140,150,0.12)"; g.fillRect(f.x - r, wy, r * 2, r * 2);
    g.strokeStyle = `rgba(${FAN_INK},0.75)`; g.lineWidth = 1;
    g.beginPath();
    for (let x = -r; x <= r; x += 3) g.lineTo(f.x + x, wy + Math.sin(x * 0.18 + tt * 1.6) * 0.8);
    g.stroke();
    const k1 = Math.min(1, f.head * 1.15);
    const sy = lerp(f.y - r * 0.72, f.y + r * 0.66, easeIn(k1) * 0.25 + easeOut(k1) * 0.75);
    for (const t0 of f.rings) {
      const k = (tt - t0) / 2.6;
      if (k > 1) continue;
      g.strokeStyle = `rgba(${FAN_INK},${0.6 * (1 - k)})`; g.lineWidth = 1;
      g.beginPath(); g.ellipse(f.x, wy, 6 + k * r * 0.9, (6 + k * r * 0.9) * 0.22, 0, 0, TAU); g.stroke();
    }
    if (sy > wy) { g.strokeStyle = `rgba(${FAN_INK},0.3)`; g.setLineDash([2, 5]); g.beginPath(); g.moveTo(f.x, wy + 4); g.lineTo(f.x, sy - 7); g.stroke(); g.setLineDash([]); }
    g.fillStyle = `rgba(${FAN_INK},0.88)`;
    g.beginPath(); g.ellipse(f.x + Math.sin(f.head * 7) * 2, sy, 6.5, 5, 0.3, 0, TAU); g.fill();
    g.strokeStyle = `rgba(${FAN_INK},0.5)`; g.beginPath(); g.moveTo(f.x - r * 0.62, f.y + r * 0.76); g.quadraticCurveTo(f.x, f.y + r * 0.7, f.x + r * 0.62, f.y + r * 0.76); g.stroke();
  }
  g.restore();
  g.strokeStyle = "rgba(150,112,64,0.95)"; g.lineWidth = 2.2;
  g.beginPath(); g.arc(f.x, f.y, r, 0, TAU); g.stroke();
  g.strokeStyle = "rgba(60,40,30,0.55)"; g.lineWidth = 0.7;
  g.beginPath(); g.arc(f.x, f.y, r + 1.5, 0, TAU); g.stroke();
  g.restore();
}
function drawPrints(list, base = 1) {
  for (const p of list) {
    const a = clamp((L.clock.t - p.t) / 0.4) * base;
    if (a <= 0) continue;
    if (p.glow) {
      p.glow = Math.max(0.35, p.glow - 0.004);
      const gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, 20);
      gr.addColorStop(0, `rgba(${LAMP},${0.35 * p.glow})`); gr.addColorStop(1, `rgba(${LAMP},0)`);
      g.fillStyle = gr; g.fillRect(p.x - 20, p.y - 20, 40, 40);
    }
    L.print(g, p.x, p.y, p.ang, p.size || 26, p.left, `rgb(${LAMP})`, 0.85 * a);
  }
}
function frame(t, dt) {
  surround();
  L.stageT();
  g.save();
  g.beginPath(); g.rect(Math.max(S.vx, -1000), Math.max(S.vy, -1000), Math.min(S.vw, 3000), Math.min(S.vh, 3000)); g.clip();
  g.beginPath(); g.rect(0, 0, S.w, S.h); g.clip();
  const leaf = view.under || view.leaf;
  drawLeaf(leaf);
  if (leaf === "n-wrist") {
    // The lamp's flame breathes; three fingertips' shadows when a finger is on the pulse.
    const fl = 0.85 + 0.1 * Math.sin(t * 7.3) + 0.05 * Math.sin(t * 17.1);
    const gr = g.createRadialGradient(281, 345, 2, 281, 345, 120);
    gr.addColorStop(0, `rgba(${LAMP},${0.14 * fl})`); gr.addColorStop(1, `rgba(${LAMP},0)`);
    g.fillStyle = gr; g.fillRect(160, 225, 240, 240);
    if (fingers.a > 0.01) {
      for (const [x, y] of [[176, 500], [190, 512], [204, 524]]) {
        const sh = g.createRadialGradient(x, y, 0, x, y, 13);
        sh.addColorStop(0, `rgba(40,28,24,${0.32 * fingers.a})`); sh.addColorStop(1, "rgba(40,28,24,0)");
        g.fillStyle = sh; g.fillRect(x - 14, y - 14, 28, 28);
      }
    }
    if (st.line && leaf === "n-wrist") {
      st.lineGlow = Math.max(0, st.lineGlow - dt * 1.6);
      L.ribbon(g, st.line, st.lineHead, { color: `rgb(${SHELL})`, glow: `rgba(${SHELL},${0.35 + 0.4 * st.lineGlow})`, glowBlur: 10 });
    }
  }
  if (leaf === "n-ward") {
    // The bare silk above the ward's walls lies under the night too (and the words are written there).
    const wash = g.createLinearGradient(0, 0, 230, 260);
    wash.addColorStop(0, "rgba(52,45,66,0.86)"); wash.addColorStop(0.55, "rgba(52,45,66,0.62)"); wash.addColorStop(1, "rgba(52,45,66,0)");
    g.fillStyle = wash; g.fillRect(0, 0, 260, 300);
  }
  if (leaf === "n-ward") {
    // The monitors glow with their beeps; the one being listened to glows more.
    st.monitors.forEach(([x, y], i) => {
      const ph = (t * (0.9 + i * 0.13) + i * 0.37) % 1, b = Math.exp(-ph * 9) * (st.lit === i ? 1 : 0.5 * st.floorBeeps);
      const gr = g.createRadialGradient(x, y, 0, x, y, 26);
      gr.addColorStop(0, `rgba(170,228,200,${0.08 + 0.3 * b})`); gr.addColorStop(1, "rgba(170,228,200,0)");
      g.fillStyle = gr; g.fillRect(x - 26, y - 26, 52, 52);
    });
    const lampG = g.createRadialGradient(218, 368, 2, 218, 368, 70);
    lampG.addColorStop(0, `rgba(${LAMP},0.18)`); lampG.addColorStop(1, `rgba(${LAMP},0)`);
    g.fillStyle = lampG; g.fillRect(148, 298, 140, 140);
    drawPrints(st.prints);
    drawPrints(st.walk);
    st.fans.forEach(drawFan);
  }
  if (leaf === "n-bed12") {
    if (st.slip > 0) {
      // The discharge slip on the made bed, stamped.
      g.save();
      g.translate(318, 452); g.rotate(-0.12); g.globalAlpha = st.slip;
      g.scale(1.3, 1.3);
      g.fillStyle = "#f4efe4"; g.shadowColor = "rgba(20,14,24,0.35)"; g.shadowBlur = 4; g.shadowOffsetY = 1;
      g.fillRect(-26, -15, 52, 30);
      g.shadowColor = "transparent";
      g.strokeStyle = "rgba(90,110,150,0.45)"; g.lineWidth = 0.6;
      for (let i = 0; i < 3; i += 1) { g.beginPath(); g.moveTo(-20, -6 + i * 7); g.lineTo(EN ? 4 : 2, -6 + i * 7); g.stroke(); }
      g.strokeStyle = "#b8432c"; g.lineWidth = 1.3; g.strokeRect(EN ? -4 : 4, -10, EN ? 28 : 19, 20);
      g.fillStyle = "#b8432c"; g.font = L.face(EN ? FAM.roman : FAM.block, EN ? 5.6 : 8.5, 900); g.textAlign = "center"; g.textBaseline = "middle";
      if (EN) g.fillText(W.slip, 10, 0.5); else { g.fillText("出", 13.5, -4); g.fillText("院", 13.5, 5); }
      g.restore();
    }
    if (st.plateA > 0) {
      if (EN) L.htext(g, W.plate, 380, 492, 14, { font: FAM.roman, color: `rgba(${SHELL},0.95)`, align: "right", alpha: st.plateA, glow: "rgba(24,20,30,0.95)", maxW: 96, lead: 1.25 });
      else L.vcol(g, W.plate, 374, 474, 18, { font: FAM.brush, color: `rgb(${SHELL})`, alpha: st.plateA * 0.92, glow: "rgba(24,20,30,0.95)" });
    }
    if (st.calm && st.calmHead > 0) {
      const pts = [];
      for (let i = 0; i < st.calm.length - 1; i += 1) {
        const [x0, y0] = st.calm[i], [x1, y1] = st.calm[i + 1];
        for (let s = 0; s < 1; s += 0.05) {
          const b = L.beatShape(s);
          const nx = -(y1 - y0), ny = x1 - x0, d = Math.hypot(nx, ny) || 1;
          pts.push([lerp(x0, x1, s) + (nx / d) * b * 9, lerp(y0, y1, s) + (ny / d) * b * 9, 1.4 + b * 0.9]);
        }
      }
      L.ribbon(g, pts, st.calmHead, { color: GOLD, glow: `rgba(${LAMP},0.55)`, glowBlur: 9 });
    }
    drawPrints(st.prints);
    if (st.willow > 0) {
      const wl = willowTinted(GOLD);
      if (wl) {
        g.save();
        g.globalAlpha = st.willow * 0.95;
        g.beginPath(); g.rect(272, 46, 116, 278); g.clip();
        const sway = Math.sin(t * 0.9) * 0.03;
        g.translate(392, 46); g.rotate(sway); g.translate(-392, -46);
        g.shadowColor = `rgba(${LAMP},0.5)`; g.shadowBlur = 8;
        g.drawImage(wl, 262, 40 - (1 - st.willow) * 30, 190, 145);
        g.restore();
      }
    }
  }
  if (view.under && view.snap) drawFold();
  if (st.sheet > 0) {
    g.save();
    const y = SH.y + (1 - st.sheet) * 70;
    g.globalAlpha = clamp(st.sheet * 1.6);
    g.shadowColor = "rgba(12,8,16,0.55)"; g.shadowBlur = 30; g.shadowOffsetY = 12;
    g.fillStyle = "#e9dcc0"; g.fillRect(SH.x, y, SH.w, SH.h);
    g.shadowColor = "transparent";
    g.translate(SH.x, y);
    drawSheet(g, st.write, st.sealA);
    drawSheetHead(g, st.write > 0.15 ? clamp((st.write - 0.15) * 3) : 0);
    g.restore();
    if (st.orange > 0) {
      const o = L.img["n-orange"];
      if (L.ok(o)) {
        g.save(); g.globalAlpha = st.orange;
        g.shadowColor = "rgba(12,8,16,0.45)"; g.shadowBlur = 10; g.shadowOffsetY = 4;
        g.drawImage(o, 8, SH.y + SH.h - (EN ? 12 : 52) + (1 - st.orange) * 14, 112, 90);
        g.restore();
      }
    }
  }
  L.drawCaps(g, 0);
  L.drawCaps(g, 1);
  L.drawRipples(g, SHELL);
  g.restore();
}

/* ---------- every touch answers ---------- */
L.on("down", (x, y) => {
  const s = window.__lszStep;
  if (s === "ward" || s === "bedA" || s === "bedB" || s === "twelve") beep(Math.floor((x / S.w) * 5), 0.16, (x / S.w) * 2 - 1);
  else if (s === "record" || s === "writing" || s === "seal" || s === "last" || s === "keep" || s === "done") L.snd.hiss({ dur: 0.04, from: 3000, q: 2, vel: 0.12 });
  else { heart(0.35, (x / S.w) * 2 - 1); harmonic(Math.floor((y / S.h) * 5) + 3, 0.08, 1.2); }
});

L.frame(frame);
L.run([open, wrist, ward, walk, door, record]);
})();

</script>
