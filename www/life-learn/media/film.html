<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>人生广场 · Life Plaza — 宣传片</title>
<meta name="description" content="人生广场 Life Plaza 宣传片（中文 / English）。送给只活过一种人生的人。" />
<style>
  :root { --paper: #f6eee3; --ink: #3a2e28; --teal: #2f6f6a; --soft: rgba(58, 46, 40, 0.62); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  h1 { margin: 0; font-family: "Noto Serif SC", "Songti SC", serif; font-size: clamp(20px, 3.4vw, 28px); letter-spacing: 0.04em; }
  h1 small { display: block; margin-top: 4px; font-family: inherit; font-size: 13px; font-weight: 400; color: var(--soft); letter-spacing: 0.02em; }
  .langs { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(58, 46, 40, 0.08); }
  .langs button { border: 0; padding: 8px 16px; border-radius: 999px; background: transparent; color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--teal); color: #fff; }
  video { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; background: #1c1714; box-shadow: 0 24px 50px -28px rgba(30, 20, 15, 0.55); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 14px; font-size: 14px; color: var(--soft); }
  a.play { display: inline-block; padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--paper); text-decoration: none; font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">人生广场 · Life Plaza<small id="sub">宣传片 · 送给只活过一种人生的人。</small></h1>
    <div class="langs" role="group" aria-label="语言 Language">
      <button type="button" data-lang="zh" aria-pressed="true">中文</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </header>
  <video id="film" controls playsinline preload="metadata" poster="cover.jpg"></video>
  <div class="row">
    <span id="note">点右上角切换中文 / English，进度不会丢。</span>
    <a class="play" id="play" href="https://capture.meetmind.online/life-learn/">去试玩人生广场 →</a>
  </div>
</main>
<script>
  const FILMS = { zh: "life-plaza-film-zh.mp4?v=20261010b", en: "life-plaza-film-en.mp4" };
  const TEXT = {
    zh: { sub: "宣传片 · 送给只活过一种人生的人。", note: "点右上角切换中文 / English，进度不会丢。", play: "去试玩人生广场 →", html: "zh-CN", href: "https://capture.meetmind.online/life-learn/" },
    en: { sub: "Film · They all waited a long time. Maybe you are waiting too.", note: "Switch 中文 / English at the top right; your place is kept.", play: "Play Life Plaza →", html: "en", href: "https://capture.meetmind.online/life-learn/?lang=en" },
  };
  const video = document.getElementById("film");
  let lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "zh";
  function show(next, keepPlace) {
    const t = keepPlace ? video.currentTime : 0, playing = keepPlace && !video.paused;
    lang = next;
    const x = TEXT[lang];
    document.documentElement.lang = x.html;
    document.getElementById("sub").textContent = x.sub;
    document.getElementById("note").textContent = x.note;
    const a = document.getElementById("play"); a.textContent = x.play; a.href = x.href;
    document.querySelectorAll(".langs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    video.src = FILMS[lang];
    if (keepPlace) video.addEventListener("loadedmetadata", () => { video.currentTime = Math.min(t, video.duration || t); if (playing) video.play().catch(() => {}); }, { once: true });
  }
  document.querySelectorAll(".langs button").forEach((b) => b.addEventListener("click", () => { if (b.dataset.lang !== lang) show(b.dataset.lang, true); }));
  show(lang, false);
</script>
</body>
</html>
