px 11px #ffffff80}.boot-sheen{inset:0;overflow:hidden}.boot-sheen:before{content:"";background:conic-gradient(#fff0 0deg,#ffffff57 22deg,#fff0 50deg 360deg);animation:12s linear infinite boot-sheen;position:absolute;inset:-32%}.boot-halo{opacity:calc(.08 + var(--p,.06) * .85);pointer-events:none;z-index:1;mix-blend-mode:screen;background:radial-gradient(circle,#ffe4a0b3 0%,#ffe4a000 58%);inset:-26%}.boot-hole{width:46%;height:46%;transform:scale(calc(.13 + var(--p,.06) * .87));will-change:transform;border-radius:50%;position:absolute;top:27%;left:27%}.boot-hole:before{content:"";background:radial-gradient(circle,#4062548c 60%,#40625400 71%);border-radius:50%;position:absolute;inset:-7%}.boot-light{background:radial-gradient(circle,#fffefa 0%,#fff7e0 44%,#fde6ad 68%,#f6c874bf 86%,#f6c87400 100%);border-radius:50%;animation:2.8s ease-in-out infinite boot-breathe;position:absolute;inset:0;box-shadow:0 0 22px 6px #ffdc9680}.boot-flood{pointer-events:none;opacity:0;background:radial-gradient(circle,#fffbf2 0%,#fff7e9 54%,#fff7e900 70%);border-radius:50%;width:300vmax;height:300vmax;margin:-150vmax 0 0 -150vmax;transition:transform 1.25s cubic-bezier(.7,0,.3,1),opacity .25s;position:absolute;top:50%;left:50%;transform:scale(.002)}.boot-hint{letter-spacing:.12em;color:#5d6b72;min-height:1.6em;font-family:Kaiti SC,STKaiti,KaiTi,PlazaSerif,serif;font-size:15px;line-height:1.6;transition:opacity .45s}.boot.open .boot-flood{opacity:1;transform:scale(1)}.boot.open .boot-sub,.boot.open .boot-title,.boot.open .boot-hint{opacity:0}.boot.dark{background:#0b0908}.boot.dark:before,.boot.dark .boot-card{opacity:0}@keyframes boot-breathe{0%,to{opacity:.84;transform:scale(.95)}50%{opacity:1;transform:scale(1.04)}}@keyframes boot-sheen{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.boot-light,.boot-sheen:before{animation:none}}</style>

  <body>
    <canvas id="world"></canvas>
    <div id="ui"></div>
    <div id="boot" class="boot">
      <div class="boot-card">
        <div class="boot-sub" id="boot-sub">LIFE PLAZA</div>
        <div class="boot-title" id="boot-title">人生广场</div>
        <div class="boot-pillow" aria-hidden="true">
          <div class="boot-halo"></div>
          <div class="boot-glaze"></div>
          <div class="boot-sheen"></div>
          <div class="boot-hole"><i class="boot-light"></i></div>
          <i class="boot-flood"></i>
        </div>
        <div class="boot-hint" id="boot-hint">广场的灯正一盏盏亮起来。</div>
      </div>
    </div>
    <script>
      // The way in speaks the visitor's language before any module runs (src/i18n.js decides the same way), and is dark at
      // once for someone arriving through the iris from another life (main.js reads and clears that flag).
      (function () {
        var norm = function (v) { v = String(v || "").trim().toLowerCase(); return v.indexOf("zh") === 0 ? "zh" : v.indexOf("en") === 0 ? "en" : ""; };
        var q = new URLSearchParams(location.search), lang = norm(q.get("lang"));
        if (!lang) { try { lang = norm(localStorage.getItem("lifeplaza.lang")); } catch (e) { /* private mode */ } }
        if (!lang) { var first = (navigator.languages && navigator.languages[0]) || navigator.language; lang = first ? (norm(first) === "zh" ? "zh" : "en") : "zh"; }
        var life = (q.get("go") || "plaza") !== "plaza", $ = function (id) { return document.getElementById(id); };
        if (lang === "en") {
          document.documentElement.lang = "en";
          $("boot-sub").textContent = "人 生 广 场";
          $("boot-title").textContent = "Life Plaza";
          $("boot-hint").textContent = life ? "The door is opening." : "The plaza's lamps are coming on, one by one.";
        } else if (life) $("boot-hint").textContent = "门开了。";
        try { if (sessionStorage.getItem("lp.iris") === "1") $("boot").classList.add("dark"); } catch (e) { /* private mode */ }
      })();
    </script>
